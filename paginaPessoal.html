<!DOCTYPE html> <!-- declara html -->
<html> <!-- pega a pagina toda -->
<head> <!-- onde fica as declarações -->
<style> 

body {
  font-family: Arial;
  background-color: #f5f5f5;
  margin: 40px;
}

.foto {
  width: 200px;
  border-radius: 50%;
  border: 3px solid #2c3e50;
  padding: 5px;
  display: block;
  margin: auto;
}

.titulo {
  color: #2c3e50;
  text-align: center;
}

#nome {
  text-align: center;
  font-weight: bold;
}

.subtitulo {
  color: #2c3e50;
}

.lista {
  background-color: #ecf0f1;
  padding: 15px;
  border-radius: 8px;
}

.lista li {
  margin-bottom: 10px;
}

.lista li:hover {
  color: #e74c3c;
}

p {
  font-size: 20px;
}

button {
  padding: 5px;
}

/* Adicionado aqui */
.container {
  background-color: white;
}
</style>
</head>

<body> <!-- onde começa o corpo da pagina -->

<!-- Conteudo da pagina -->
<div class="container">
  <h1 class="titulo">Sobre mim</h1>
  <img class="foto" src="https://avatars.githubusercontent.com/u/149411762?v=4">
  <p id="nome">Meu nome é Luiz</p>
  <h2 class="subtitulo">Meus interesses</h2>

  <ul class="lista">
  <li>Programação</li>
  <li>Jogos</li>
  <li>Livros</li>
  </ul>

  <button>Clique aqui</button>
</div>

</body>
</html>
